name: Release native artifacts

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require matching package versions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          actual=$(node -p "require('./node/package.json').version")
          test "$actual" = "$expected" || {
            echo "Release $TAG does not match @nool/chronicle@$actual" >&2
            exit 1
          }
          for manifest in node/npm/*/package.json; do
            platform=$(node -p "require('./$manifest').version")
            test "$platform" = "$expected" || {
              echo "$manifest is $platform, expected $expected" >&2
              exit 1
            }
          done
          node - "$expected" <<'NODE'
          const expected = process.argv[2]
          const main = require('./node/package.json')
          const lock = require('./node/package-lock.json')
          if (lock.version !== expected || lock.packages[''].version !== expected) {
            throw new Error(`package-lock.json does not consistently use ${expected}`)
          }
          for (const [name, version] of Object.entries(main.optionalDependencies)) {
            if (version !== expected) {
              throw new Error(`${name} dependency is ${version}, expected ${expected}`)
            }
          }
          NODE

  build:
    name: Build ${{ matrix.name }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            artifact: darwin-x64
          - name: macOS Apple Silicon
            os: macos-14
            artifact: darwin-arm64
          - name: Linux x64
            os: ubuntu-latest
            artifact: linux-x64-gnu
          - name: Windows x64
            os: windows-latest
            artifact: win32-x64-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and validate
        working-directory: node
        run: |
          npm ci
          npx napi build --platform --release
          npm test
          npm run compare
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p release-assets/${{ matrix.artifact }}
          cp node/chronicle_node.*.node release-assets/${{ matrix.artifact }}/
          cp node/chronicle_node.*.node node/npm/${{ matrix.artifact }}/
          cd release-assets/${{ matrix.artifact }}
          shasum -a 256 chronicle_node.*.node > SHA256SUMS-${{ matrix.artifact }}
      - name: Publish the optional platform package
        shell: bash
        working-directory: node/npm/${{ matrix.artifact }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_NOOL_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo "NPM_NOOL_TOKEN is required to publish release packages" >&2
            exit 1
          }
          cp ../../../LICENSE LICENSE
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is already published"
          else
            npm publish --access public
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}/
          if-no-files-found: error

  macos-benchmarks:
    name: Publish macOS benchmark evidence
    needs: validate-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run complete macOS evidence suite
        working-directory: node
        run: |
          npm ci
          npm run build:release
          npm test
          npm run compare
          mkdir -p ../benchmarks/results
          CHRONICLE_BENCHMARK_BUILD_PROFILE=release node ../benchmarks/extensive.cjs --runs 7 --output ../benchmarks/results/macos-arm64-${{ github.ref_name }}-extensive.json
          CHRONICLE_BENCHMARK_BUILD_PROFILE=release node ../benchmarks/runtime.cjs --output ../benchmarks/results/macos-arm64-${{ github.ref_name }}-runtime.json
          node ../benchmarks/render-report.cjs \
            --input ../benchmarks/results/macos-arm64-${{ github.ref_name }}-extensive.json \
            --runtime ../benchmarks/results/macos-arm64-${{ github.ref_name }}-runtime.json \
            --output-dir ../benchmarks/results/rendered
          node -e "for (const file of process.argv.slice(1)) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))" \
            ../benchmarks/results/macos-arm64-${{ github.ref_name }}-extensive.json \
            ../benchmarks/results/macos-arm64-${{ github.ref_name }}-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-benchmark
          path: benchmarks/results/
          if-no-files-found: error

  publish:
    name: Attach release evidence
    needs: [build, macos-benchmarks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_NOOL_PUBLIC_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Chronicle $TAG" --generate-notes
          fi
      - name: Upload binaries and benchmark report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_NOOL_PUBLIC_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: find release-assets -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
      - name: Publish the main npm package
        shell: bash
        working-directory: node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_NOOL_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo "NPM_NOOL_TOKEN is required to publish release packages" >&2
            exit 1
          }
          cp ../LICENSE LICENSE
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is already published"
          else
            npm publish --access public
          fi
